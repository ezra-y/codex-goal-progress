name: macOS Release Installation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installation:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/'))
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
      - run: pnpm install --frozen-lockfile
      - name: Build the package to be published
        run: |
          export GOAL_PROGRESS_NODE_BINARY="$(command -v node)"
          pnpm build:release:macos
          pnpm package:release:macos
          cp install.sh dist/release/assets/install.sh
      - name: Install official Codex and verify upgrade and clean reinstall
        run: python3 scripts/release_install_smoke.py
      - name: Save installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-installation-evidence
          path: dist/release/smoke-evidence
          if-no-files-found: error
      - name: Save the verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-macos-release
          path: dist/release/assets
          if-no-files-found: error
