name: HOL Plugin Scanner
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@b290274eaf945b9c2ff6d1d8c8151da844eb1c9e # v1
        with:
          plugin_dir: .
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          upload_sarif: true
          pr_comment: off
